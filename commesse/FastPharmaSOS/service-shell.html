<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bozza Service Shell FastPharmaSOS.">
  <title>FastPharma SOS</title>
  <link rel="stylesheet" href="./css/service-shell.css">
</head>
<body>
  <div class="service-shell">
    <header class="shell-header">
      <a class="shell-brand" href="#" aria-label="FastPharma SOS">
        <span class="brand-symbol" aria-hidden="true">SOS</span>
        <span class="brand-copy">
          <strong>FastPharma</strong>
          <small>servizio tecnico</small>
        </span>
      </a>

      <div class="shell-context" aria-label="Contesto utente">
        <span class="tenant">FastPharma</span>
        <button class="account-button" type="button" disabled aria-disabled="true">
          Accesso
        </button>
      </div>
    </header>

    <main class="shell-main">
      <section
        id="termodel-mcp-dock"
        class="module-dock"
        aria-label="Spazio riservato al modulo Termodel MCP"
      >
        <div class="dock-label">Modulo Termodel MCP</div>

        <div class="dock-placeholder" aria-hidden="true">
          <span>FastPharma</span>
          <strong>SOS</strong>
        </div>

        <div class="dock-state">
          spazio di docking · modulo non ancora caricato
        </div>
      </section>
    </main>

    <footer class="shell-footer">
      <span>FastPharma SOS</span>
      <span class="prototype-note">bozza Service Shell</span>
    </footer>
  </div>
</body>
</html>
