<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="#Imbattibile — gestionale in fase di sviluppo.">
  <title>#Imbattibile · Lavori in corso</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: grid;
      place-items: center;
    }
    main {
      width: min(720px, calc(100% - 40px));
      text-align: center;
      padding: 56px 28px;
    }
    .tag {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 14px;
      border: 1px solid rgba(248,250,252,.28);
      border-radius: 999px;
      font-size: 15px;
      letter-spacing: .04em;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 84px);
      line-height: .95;
    }
    p {
      margin: 26px auto 0;
      max-width: 560px;
      color: #cbd5e1;
      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.5;
    }
    footer {
      margin-top: 50px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">#Imbattibile</div>
    <h1>Lavori in corso</h1>
    <p>Stiamo preparando il nuovo gestionale #Imbattibile.</p>
    <footer>#Imbattibile · Reggio Calabria</footer>
  </main>
</body>
</html>
