<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pratiche fotovoltaiche | Gestione pratiche</title><style>
:root{font:16px system-ui;color:#16283f;background:#f0f4f8}body{margin:0}header{padding:16px 4%;background:#12466d;color:white}main{max-width:1150px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid #d2dde6;border-radius:10px;padding:18px;margin:12px 0}select,input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #b8c8da}button{background:#125787;color:white;cursor:pointer}button:disabled{opacity:.5}.field{display:grid;grid-template-columns:1fr 1.5fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #eef1f5}.field small{display:block;color:#52687c;font-size:12px}.field input{width:100%;box-sizing:border-box}.msg{color:#a1431d}.nav{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 12px}.nav button{background:#fff;color:#164b75;border-color:#c4d1df}.nav button.active{background:#125787;color:white}.fieldset{border:1px solid #dce5ed;border-radius:8px;margin:12px 0;overflow:hidden}.fieldset summary{padding:12px;background:#f3f7fa;cursor:pointer;font-weight:650}.fieldset .field{padding:12px}.count{font-size:12px;color:#64758a}.field button{white-space:nowrap}#editor[hidden],#workspace[hidden]{display:none}@media(max-width:700px){.field{grid-template-columns:1fr}.field button{width:100%}}</style></head><body><header><h2>Pratiche fotovoltaiche — Gestione pratiche <small style="font-size:12px;opacity:.85">V1.4 · aggiorna tutto</small></h2></header><main><section class="panel" id="login"><h3>Accesso riservato</h3><form id="auth"><input type="password" id="pw" required placeholder="Segreto Render" autocomplete="current-password"><button>Accedi</button></form><p class="msg" id="authmsg"></p></section>
<section id="workspace" hidden><div class="panel"><h3>Archivio pratiche fotovoltaiche</h3><div style="margin:10px 0"><button id="refreshDb" type="button">Aggiorna da DB</button> <span id="refreshStatus" role="status"></span></div><label>Cliente <select id="clients"></select></label> <button id="newclient">Nuovo cliente</button> <label>Pratica fotovoltaica <select id="cases"></select></label> <button id="newcase">Nuova pratica fotovoltaica</button> <label>Procedimento <select id="procedures"></select></label> <button id="newprocedure">Nuovo procedimento</button></div><section id="editor" class="panel" hidden><h3 id="title">Procedimento</h3><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button id="saveAll" type="button" disabled>Salva modifiche</button><span id="saveStatus" role="status">Nessuna modifica</span></div><nav id="tabs" class="nav" aria-label="Schede procedimento"></nav><input id="search" type="search" placeholder="Cerca campo, sezione o ID"><div id="fields"></div></section></section></main><script>
const API="https://pratiche-fotovoltaico-demo-api.onrender.com";let token="",fields=[],tab="Autorizza",dirty={};const el=id=>document.getElementById(id);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{"Authorization":"Bearer "+token,...opts.headers}});if(!r.ok)throw Error("Errore API "+r.status);return await r.json();}
function options(id,items,key,label){el(id).innerHTML=items.map(x=>'<option value="'+escapeHtml(x[key])+'">'+escapeHtml(x[label])+'</option>').join("");}
function canLeave(){return !Object.keys(dirty).length||confirm("Ci sono modifiche non salvate. Abbandonarle?");}
function status(){const n=Object.keys(dirty).length;el("saveAll").disabled=!n;el("saveStatus").textContent=n?n+" modifiche da salvare":"Nessuna modifica da salvare";}
async function clients(){const rows=await api("/api/v1/clients");options("clients",rows,"client_id","display_name");await cases();}
async function cases(){const id=el("clients").value;if(!id)return;const rows=await api("/api/v1/cases/"+encodeURIComponent(id));options("cases",rows,"case_id","title");await procedures();}
async function procedures(){const id=el("cases").value;if(!id)return;const rows=await api("/api/v1/procedures/"+encodeURIComponent(id));options("procedures",rows,"procedure_id","title");await load();}
async function load(){const id=el("procedures").value;if(!id)return;fields=await api("/api/v1/fields/"+encodeURIComponent(id));dirty={};el("editor").hidden=false;tab="Autorizza";draw();status();}
const groups=["Autorizza","Allegato A","Allegato C","Allegato D","Allegato E","Impianto","Fine Opere","Allegati","Controllo e Inoltro"];
function groupOf(f){const s=(f.section||"").trim().toLowerCase();for(const g of groups){if(s===g.toLowerCase()||s.startsWith(g.toLowerCase()+" >")||s.startsWith(g.toLowerCase()+" -")||s.startsWith(g.toLowerCase()+" ("))return g;}return "Controllo e Inoltro";}
function draw(){const q=el("search").value.toLowerCase();
el("tabs").innerHTML=groups.map(g=>'<button type="button" data-tab="'+escapeHtml(g)+'" class="'+(tab===g?"active":"")+'">'+escapeHtml(g)+' <span class="count">('+fields.filter(f=>groupOf(f)===g).length+')</span></button>').join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw();});
const selected=fields.filter(f=>groupOf(f)===tab),filtered=selected.filter(f=>[f.field_id,f.label,f.section].some(s=>(s||"").toLowerCase().includes(q)));
el("title").textContent=tab+" — "+filtered.length+" campi";
const sections={};filtered.forEach(f=>(sections[f.section]??=[]).push(f));
el("fields").innerHTML=Object.entries(sections).map(([name,items])=>'<details class="fieldset" open><summary>'+escapeHtml(name)+' — '+items.length+' campi</summary>'+items.map(f=>'<div class="field"><label>'+escapeHtml(f.label)+'<small>'+escapeHtml(f.field_id)+'</small></label><input data-field="'+escapeHtml(f.field_id)+'" value="'+escapeHtml(Object.prototype.hasOwnProperty.call(dirty,f.field_id)?dirty[f.field_id]:f.captured_value??"")+'"></div>').join("")+'</details>').join("")||"<p>Nessun campo in questa scheda.</p>";
document.querySelectorAll("[data-field]").forEach(input=>input.oninput=()=>{const f=fields.find(x=>x.field_id===input.dataset.field);if(!f)return;if(input.value===(f.captured_value??""))delete dirty[f.field_id];else dirty[f.field_id]=input.value;status();});
}
el("newclient").onclick=async()=>{const name=prompt("Nome del cliente:");if(!name?.trim())return;try{await api("/api/v1/clients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({displayName:name})});await clients();}catch(e){alert(e.message);}};
el("newcase").onclick=async()=>{const title=prompt("Descrizione della pratica fotovoltaica:");if(!title?.trim())return;try{await api("/api/v1/cases",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:el("clients").value,title})});await cases();}catch(e){alert(e.message);}};
el("newprocedure").onclick=async()=>{const models=await api("/api/v1/models");if(models.length!==1){alert("Selezione modello non ancora configurata per più modelli.");return;}try{await api("/api/v1/procedures",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caseId:el("cases").value,modelId:models[0].model_id})});await procedures();}catch(e){alert(e.message);}};
el("search").oninput=draw;el("clients").onchange=async()=>{if(!canLeave()){await clients();return;}dirty={};await cases();};el("cases").onchange=async()=>{if(!canLeave()){await cases();return;}dirty={};await procedures();};el("procedures").onchange=async()=>{if(!canLeave()){await procedures();return;}dirty={};await load();};
el("refreshDb").onclick=async()=>{const pending=Object.keys(dirty).length;
 if(pending&&!confirm("Hai "+pending+" modifiche non salvate. Aggiornando tutto da DB queste modifiche andranno perse. Continuare?"))return;
 const btn=el("refreshDb"), notice=el("refreshStatus");
 const selectedClient=el("clients").value, selectedCase=el("cases").value, selectedProcedure=el("procedures").value;
 btn.disabled=true;notice.textContent="Aggiornamento completo in corso…";
 try {
   // Tutte le letture prima di modificare la vista: un errore non elimina le modifiche locali.
   const clientRows=await api("/api/v1/clients");
   const clientId=clientRows.some(r=>r.client_id===selectedClient)?selectedClient:(clientRows[0]?.client_id??"");
   const caseRows=clientId?await api("/api/v1/cases/"+encodeURIComponent(clientId)):[];
   const caseId=caseRows.some(r=>r.case_id===selectedCase)?selectedCase:(caseRows[0]?.case_id??"");
   const procedureRows=caseId?await api("/api/v1/procedures/"+encodeURIComponent(caseId)):[];
   const procedureId=procedureRows.some(r=>r.procedure_id===selectedProcedure)?selectedProcedure:(procedureRows[0]?.procedure_id??"");
   const refreshedFields=procedureId?await api("/api/v1/fields/"+encodeURIComponent(procedureId)):[];
   options("clients",clientRows,"client_id","display_name");el("clients").value=clientId;
   options("cases",caseRows,"case_id","title");el("cases").value=caseId;
   options("procedures",procedureRows,"procedure_id","title");el("procedures").value=procedureId;
   fields=refreshedFields;dirty={};el("editor").hidden=!procedureId;
   if(procedureId)draw();else el("fields").innerHTML="";
   status();
   notice.textContent="Aggiornati clienti ("+clientRows.length+"), pratiche ("+caseRows.length+"), procedimenti ("+procedureRows.length+") e campi ("+refreshedFields.length+").";
 }catch(e){notice.textContent="Aggiornamento fallito: "+e.message+"; dati locali conservati.";}
 finally{btn.disabled=false;}
};
el("saveAll").onclick=async()=>{const values=Object.entries(dirty).map(([fieldId,value])=>({fieldId,value}));if(!values.length)return;const btn=el("saveAll");btn.disabled=true;el("saveStatus").textContent="Salvataggio in corso…";try{const id=el("procedures").value;await api("/api/v1/values/"+encodeURIComponent(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({values})});for(const v of values){const f=fields.find(x=>x.field_id===v.fieldId);if(f)f.captured_value=v.value;delete dirty[v.fieldId];}status();el("saveStatus").textContent=values.length+" campi salvati nel database";}catch(e){status();el("saveStatus").textContent="Errore: nessuna modifica salvata. "+e.message;}};
window.addEventListener("beforeunload",e=>{if(Object.keys(dirty).length){e.preventDefault();e.returnValue="";}});
el("auth").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+"/api/demo/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:el("pw").value})});el("pw").value="";if(!r.ok)throw Error("Accesso negato: HTTP "+r.status);token=(await r.json()).token;await clients();el("login").hidden=true;el("workspace").hidden=false;}catch(err){el("authmsg").textContent=err.message;}};
</script></body></html>
