function transientStatus(code){return [408,425,429,502,503,504].includes(code);}
async function getReadWithWake(url,options={},onProgress=()=>{}){
 // Retry solo su GET/HEAD idempotenti: nessun doppio POST verso Neon o OAuth.
 const method=String(options.method||'GET').toUpperCase();
 if(method!=='GET'&&method!=='HEAD')
  throw Error('Il risveglio automatico è consentito solo per letture idempotenti.');
 const maxAttempts=5;
 for(let attempt=1;attempt<=maxAttempts;attempt++){
  let response;
  try{
   response=await fetch(url,{...options,method,cache:'no-store',
    signal:AbortSignal.timeout(35000)});
  }catch(error){
   if(attempt===maxAttempts)
    throw Error('Server Render non raggiungibile dopo '+maxAttempts+' tentativi.');
   onProgress('Risveglio del server Render: nuovo tentativo '+(attempt+1)+' di '+maxAttempts+'…');
   await pause(Math.min(2000*attempt,8000));continue;
  }
  if(transientStatus(response.status)){
   if(attempt===maxAttempts)
    throw Error('Server Render temporaneamente indisponibile (HTTP '+
      response.status+') dopo '+maxAttempts+' tentativi.');
   onProgress('Server Render in avvio (HTTP '+response.status+
      '), tentativo '+(attempt+1)+' di '+maxAttempts+'…');
   await pause(Math.min(2000*attempt,8000));continue;
  }
  return response; // Non ritentare 400/401/403: sono errori non dovuti al risveglio.
 }
 throw Error('Server Render non disponibile.');
}
async function loadOidcMeta(){
 if(oidcMeta)return oidcMeta;
 const resp=await getReadWithWake(testApi+'/api/meta',{},msg=>authFeedback(msg));
 if(!resp.ok)throw Error('Server Commesse HTTP '+resp.status);
 const info=await resp.json();
 if(info.authentication!=='openid-connect'||
    typeof info.oidcAuthorization!=='string'||
    typeof info.oidcToken!=='string'||
    info.oidcClientId!=='fastpharma-commesse')
   throw Error('Il server Commesse non è configurato come client FastPharma Access.');
 if(!info.oidcAuthorization.startsWith('https://')||
    !info.oidcToken.startsWith('https://'))
   throw Error('Endpoint FastPharma Access non HTTPS.');
 oidcMeta=info;return info;
}
function base64url(bytes){
 const input=Array.from(bytes,x=>String.fromCharCode(x)).join('');
 return btoa(input).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function beginOidcLogin(){
 loginButton.disabled=true;
 authFeedback('Apertura autenticazione centralizzata FastPharma…');
 try{
  const cfg=await loadOidcMeta();
  const verifier=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const state=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const nonce=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  const challenge=base64url(new Uint8Array(digest));
  const transaction={verifier,state,nonce,redirect:oidcRedirectUri,at:Date.now()};
  sessionStorage.setItem(pkceStorageKey,JSON.stringify(transaction));
  const uri=new URL(cfg.oidcAuthorization);
  uri.searchParams.set('client_id',cfg.oidcClientId);
  uri.searchParams.set('redirect_uri',oidcRedirectUri);
  uri.searchParams.set('response_type','code');
  uri.searchParams.set('response_mode','query');
  uri.searchParams.set('scope','openid profile commesse');
  uri.searchParams.set('state',state);
  uri.searchParams.set('nonce',nonce);
  uri.searchParams.set('code_challenge',challenge);
  uri.searchParams.set('code_challenge_method','S256');
  window.location.assign(uri.toString());
 }catch(error){
  authFeedback('Autenticazione non avviata: '+(error.message||'errore di rete'),true);
  loginButton.disabled=false;
 }
}
async function apiCall(path,options={}){
 if(!authToken)throw Error('Accesso richiesto: usa FastPharma Access');
 const headers=new Headers(options.headers||{});
 headers.set('Authorization','Bearer '+authToken);
 const method=String(options.method||'GET').toUpperCase();
 // Letture protette anche durante il risveglio Render. Le scritture
 // POST/PUT/DELETE vengono effettuate UNA sola volta per evitare duplicati.
 const response=(method==='GET'||method==='HEAD')
  ?await getReadWithWake(testApi+path,{...options,headers},
    msg=>alertDemo(msg))
  :await fetch(testApi+path,{...options,headers,cache:'no-store'});
 if(response.status===401){
  authToken='';
  document.getElementById('commesse-app').hidden=true;
  document.getElementById('commesse-auth').hidden=false;
  const error=Error('La sessione Commesse è scaduta. Accedi di nuovo con FastPharma Access.');
  error.status=401;throw error;
 }
 if(!response.ok){
  const body=await response.json().catch(()=>({}));
  const error=Error(body.error||body.title||
    (transientStatus(response.status)?'Servizio temporaneamente non disponibile':'Server HTTP '+response.status));
  error.status=response.status;error.code=body.code||'';
  throw error;
 }
 return response;
}
async function completeOidcCallback(){
 const parameters=new URLSearchParams(location.search);
 const code=parameters.get('code'),receivedState=parameters.get('state');
 const remoteError=parameters.get('error');
 if(!code && !remoteError)return false;
 // Il codice è eliminato subito dall'URL, anche se il token exchange fallisce.
 history.replaceState(null,'',location.pathname+location.hash);
 if(remoteError)throw Error('FastPharma Access: '+remoteError);
 const saved=sessionStorage.getItem(pkceStorageKey);
 sessionStorage.removeItem(pkceStorageKey);
 let entry;
 try{entry=JSON.parse(saved||'null');}catch(_){entry=null;}
 if(!entry||typeof entry.state!=='string'||entry.state!==receivedState||
    !entry.verifier || entry.redirect!==oidcRedirectUri||
    !Number.isFinite(entry.at)||Date.now()-entry.at>10*60*1000)
   throw Error('Risposta di autorizzazione scaduta o non corrispondente alla richiesta.');
 const cfg=await loadOidcMeta();
 const form=new URLSearchParams({
  grant_type:'authorization_code',client_id:cfg.oidcClientId,
  code,redirect_uri:oidcRedirectUri,code_verifier:entry.verifier
 });
 const res=await fetch(cfg.oidcToken,{
  method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
  cache:'no-store',credentials:'omit',body:form
 });
 const result=await res.json().catch(()=>({}));
 if(!res.ok||typeof result.access_token!=='string')
  throw Error('Token FastPharma Access non ricevuto ('+(result.error||'HTTP '+res.status)+').');
 authToken=result.access_token;
 // Il backend Commesse valida firma, issuer, audience, scadenza e scope;
 // nessun dato operativo viene mostrato prima di questo controllo.
 await apiCall('/api/auth/check');
 document.getElementById('commesse-auth').hidden=true;
 document.getElementById('commesse-app').hidden=false;
 show(pages[location.hash.slice(1)]?location.hash.slice(1):'commesse');
 authFeedback('Sessione FastPharma Access valida. Commesse collegato.');
 return true;
}
loginButton.addEventListener('click',()=>{void beginOidcLogin();});
document.getElementById('commesse-logout').addEventListener('click',()=>{
 authToken='';
 sessionStorage.removeItem(pkceStorageKey);
 document.getElementById('page').replaceChildren();
 document.getElementById('commesse-app').hidden=true;
 document.getElementById('commesse-auth').hidden=false;
 authFeedback('Sessione Commesse terminata. FastPharma Access rimane autenticato.');
 loginButton.disabled=false;
});
(async()=>{
 try{
  if(await completeOidcCallback())return;
  if(new URLSearchParams(location.search).has('error'))return;
  // Apre il login centrale; una sessione Access già valida evita la password.
  await beginOidcLogin();
 }catch(error){
  authToken='';
  authFeedback('Autenticazione non riuscita: '+(error.message||'errore sconosciuto'),true);
  loginButton.disabled=false;
 }
})();

function syncCommessaTabs(page='commesse'){

   details=document.getElementById('tab-details'),
   quote=document.getElementById('tab-quote');

  selected&&page!=='commesse'?'tab-details':'tab-general';

function fmtSnapshotNumber(value,money=false){
 if(value==null||value==='')return '—';
 const n=Number(value);if(!Number.isFinite(n))return '—';
 return money?euro(n):n.toLocaleString('it-IT',{maximumFractionDigits:5});
}
function quoteText(parent,label,value){
 const span=document.createElement('span'),strong=document.createElement('strong');
 strong.textContent=label+': ';span.append(strong,document.createTextNode(value==null||value===''?'—':String(value)));
 parent.append(span);
}

async function readQuoteTab(requestSerial){
 const panel=view.querySelector('#snapshot-content');if(!panel)return;
 try{
  const rows=await readList('/api/commesse/'+currentProjectId);
  if(requestSerial!==renderSerial||!panel.isConnected)return;
  const project=rows[0];if(!project)throw Error('Commessa non disponibile');
  panel.replaceChildren();
  const intro=document.createElement('p');intro.className='snapshot-note';
  intro.textContent='Corpo commerciale conservato alla creazione della commessa. Non è possibile modificare capitoli, voci o prezzi.';
  panel.append(intro);
  const heading=document.createElement('div');heading.className='snapshot-info snapshot-summary';
  quoteText(heading,'Commessa',project.codice);
  quoteText(heading,'Preventivo',project.preventivoRiferimento);
  quoteText(heading,'Cliente',project.cliente);panel.append(heading);
  let snap;
  try{snap=typeof project.preventivoSnapshot==='string'
   ?JSON.parse(project.preventivoSnapshot):project.preventivoSnapshot;}catch{snap=null;}
  if(!snap||snap.version!=='commesse-quote-v1'||!Array.isArray(snap.chapters)){
   const warning=document.createElement('p');warning.className='snapshot-empty';
   warning.textContent='Questa commessa storica non contiene il corpo del preventivo archiviato. È disponibile il solo riferimento commerciale, ove presente. Nessuna ricostruzione presunta.';
   panel.append(warning);return;
  }
  const meta=document.createElement('div');meta.className='snapshot-info';
  quoteText(meta,'Oggetto',snap.subject);quoteText(meta,'Emittente',snap.issuerName);
  quoteText(meta,'Stato al momento della copia',snap.status);panel.append(meta);
  const total=document.createElement('p');total.className='snapshot-summary';
  total.textContent='Imponibile acquisito: '+fmtSnapshotNumber(snap.taxable,true)+
   (snap.partial?' · Preventivo con dati parziali':'');
  panel.append(total);
  if(!snap.chapters.length){
   const empty=document.createElement('p');empty.className='snapshot-empty';
   empty.textContent='Il preventivo selezionato non conteneva capitoli.';
   panel.append(empty);
  }
  for(const [index,ch] of snap.chapters.map((chapter,i)=>({chapter,i}))
   .sort((a,b)=>Number(a.chapter.order??a.i)-Number(b.chapter.order??b.i))
   .map((item,i)=>[i,item.chapter])){
   const details=document.createElement('details');details.className='snapshot-chapter';
   const summary=document.createElement('summary');
   const name=document.createElement('span');name.textContent=(index+1)+'. '+(ch.title||'Capitolo');
   const count=document.createElement('span');
   const lines=Array.isArray(ch.lines)?ch.lines:[];
   count.textContent=lines.length+' voci · espandi';
   summary.append(name,count);details.append(summary);
   if(ch.notes){
    const note=document.createElement('p');note.className='snapshot-note';
    note.style.padding='6px 14px';note.textContent=ch.notes;details.append(note);
   }
   const wrap=document.createElement('div');wrap.className='snapshot-table';
   const table=document.createElement('table'),thead=document.createElement('thead');
   const tr=document.createElement('tr');
   for(const heading of ['Codice','Descrizione','U.M.','Quantità','Prezzo unitario','Importo','Note']){
    const th=document.createElement('th');th.textContent=heading;tr.append(th);
   }
   thead.append(tr);table.append(thead);
   const body=document.createElement('tbody');let subtotal=0,priced=0;
   for(const item of lines){
    const quantity=item.quantity==null?null:Number(item.quantity);
    const price=item.saleUnitPrice==null?null:Number(item.saleUnitPrice);
    const valid=quantity!==null&&price!==null&&Number.isFinite(quantity)&&Number.isFinite(price);
    const amount=valid?quantity*price:null;
    if(valid){subtotal+=amount;priced++;}
    const row=document.createElement('tr');
    for(const value of [item.code||'—',item.description||'—',item.unit||'—',
      fmtSnapshotNumber(quantity),fmtSnapshotNumber(price,true),
      fmtSnapshotNumber(amount,true),item.notes||'']){
      const td=document.createElement('td');td.textContent=String(value);row.append(td);
    }
    body.append(row);
   }
   if(!lines.length){
    const row=document.createElement('tr'),td=document.createElement('td');
    td.colSpan=7;td.textContent='Nessuna voce in questo capitolo.';row.append(td);body.append(row);
   }
   table.append(body);wrap.append(table);details.append(wrap);
   const footer=document.createElement('p');footer.className='snapshot-note';
   footer.style.padding='0 14px 10px';
   footer.textContent='Somma delle voci valorizzate: '+fmtSnapshotNumber(subtotal,true)+
    (priced<lines.length?' · alcune voci prive di prezzo o quantità':'');
   details.append(footer);panel.append(details);
  }
  const note=document.createElement('p');note.className='snapshot-note';
  note.textContent='Le somme delle voci possono differire dal totale imponibile per sconti e rettifiche generali. Il contenuto è di sola consultazione.';
  panel.append(note);
 }catch(e){
  if(requestSerial!==renderSerial)return;

let renderSerial=0;
const number=x=>Number(x??0);
const valueText=x=>String(x??'—');
async function readList(path){return (await apiCall(path)).json();}
function renderRows(table,rows,deleteKind='',recordIds=[]){
 if(!table)return;
 const head=table.querySelector('tr');
 table.replaceChildren();
 if(head){
  // Le intestazioni provengono dalla schermata V4, ma le righe dal database.
  if(deleteKind){
   const th=document.createElement('th');th.textContent='Elimina';head.appendChild(th);
  }
  table.appendChild(head);
 }
 if(!rows.length){
  const tr=document.createElement('tr'),td=document.createElement('td');
  td.colSpan=head?.children.length||1;td.textContent='Nessun elemento registrato nel database.';
  tr.appendChild(td);table.appendChild(tr);return;
 }
 for(const [index,row] of rows.entries()){
  const tr=document.createElement('tr');
  for(const cell of row){
   const td=document.createElement('td');
   if(cell&&typeof cell==='object'){
    const action=document.createElement(cell.href?'a':'button');
    action.textContent=valueText(cell.label);
    if(cell.href)action.href=cell.href;
    if(cell.action)action.dataset.action=cell.action;
    if(cell.id!=null)action.dataset.id=String(cell.id);
    if(cell.filename)action.dataset.filename=String(cell.filename);
    td.appendChild(action);
   } else td.textContent=valueText(cell);
   tr.appendChild(td);
  }
  if(deleteKind){
   const td=document.createElement('td');
   const id=Number(recordIds[index]);
   if(Number.isSafeInteger(id)&&id>0){
    const button=document.createElement('button');
    button.type='button';button.className='delete-record-button';
    button.textContent='Elimina';button.dataset.action='delete';
    button.dataset.kind=deleteKind;button.dataset.id=String(id);
    button.dataset.label=row.slice(0,2).map(c=>typeof c==='object'?valueText(c.label):valueText(c)).join(' · ').slice(0,170);
    button.title='Cancella questo elemento dall’archivio TEST dopo conferma';
    td.appendChild(button);
   }
   tr.appendChild(td);
  }
  table.appendChild(tr);
 }
}

function openQuotePicker(){
 if(commessaCreationPending){

 preventiviNonce=newPickerNonce();preventiviReady=false;

window.addEventListener('message',async event=>{
 if(event.origin!==new URL(preventiviUrl).origin ||
    event.source!==preventiviPicker||!preventiviNonce)return;
 const d=event.data;
 if(d?.type==='fastpharma.quote-picker.ready'&&d.nonce===preventiviNonce){
  preventiviPicker.postMessage({type:'fastpharma.quote-picker.ack',nonce:preventiviNonce},event.origin);
  preventiviReady=true;return;
 }
 if(!preventiviReady||d?.type!=='fastpharma-commesse.quote-selected'||
    d.nonce!==preventiviNonce||commessaCreationPending)return;
 if(typeof d.id!=='string'||!/^[0-9a-f-]{36}$/i.test(d.id)||
    typeof d.reference!=='string'||d.reference.length>160||
    typeof d.subject!=='string'||!d.subject.trim()||d.subject.length>240||
    typeof d.recipientName!=='string'||!d.recipientName.trim()||
    d.recipientName.length>250||typeof d.taxable!=='number'||
    !Number.isFinite(d.taxable)||d.taxable<0||d.taxable>999999999999||
    !d.snapshot||d.snapshot.version!=='commesse-quote-v1'||
    d.snapshot.id!==d.id||d.snapshot.reference!==d.reference||
    !Array.isArray(d.snapshot.chapters)){
  alertDemo('Selezione del preventivo incompleta: nessuna commessa creata.');
  return;
 }
 const snapshotText=JSON.stringify(d.snapshot);
 if(snapshotText.length>1024*1024){
  alertDemo('Il corpo del preventivo supera 1 MB: nessuna commessa creata.');
  return;
 }
 // Blocca ogni ripetizione dell'evento prima di inviare la richiesta POST.
 commessaCreationPending=true;preventiviNonce='';preventiviReady=false;

   })
  });
  const result=await response.json();
  if(!response.ok||!result.saved||!Number.isSafeInteger(Number(result.id)))
   throw Error(result.error||'Creazione della commessa non confermata dal backend.');
  currentProjectId=Number(result.id);

});

function show(page,scrollTop=true){
 if(page!=='preventivo'&&!pages[page])page='commesse';
 if(page!=='commesse'&&(!Number.isSafeInteger(currentProjectId)||currentProjectId<=0)){
  page='commesse';alertDemo('Seleziona prima una commessa nella scheda Generale.');
 }
 if(page==='preventivo')buildQuoteTab();
 else {
  view.innerHTML=pages[page];
  if(page==='commesse')decorateGeneral();else decorateData(page);
 }
 view.querySelectorAll('a[href^="/file"]').forEach(a=>{a.dataset.demoFile='1';a.href='#';});
 view.querySelectorAll('input[type="date"]').forEach(i=>{if(i.value)i.value='2026-11-14'});
 const parent=parentPage[page];
 navigation.hidden=page==='commesse'||page==='commessa'||page==='preventivo';
 backButton.textContent=parent==='commessa'?'← Torna alla commessa':'← Torna alle commesse';
 currentLabel.textContent=pageLabel[page];
 syncCommessaTabs(page);
 if(scrollTop)window.scrollTo(0,0);
 document.title='FastPharma — Gestione Commesse V'+UI_VERSION+' TEST';
 loadTestData(page);
}
function goTo(page){
 if(page!=='preventivo'&&!pages[page])page='commesse';
 if(page!=='commesse'&&!currentProjectId){show('commesse');return;}
 if(location.hash.slice(1)===page)show(page);else location.hash=page;
}
document.addEventListener('click',e=>{
 const a=e.target.closest('a');if(!a||!a.closest('#commesse-app'))return;
 const target=a.getAttribute('href')||'';
 if(a.dataset.demoFile){e.preventDefault();alertDemo('Allegato dimostrativo: utilizzare «Scarica» nelle righe realmente registrate su Neon.');return;}
 const page=routeFor(target);
 if(page){
  e.preventDefault();
  try{
   const u=new URL(target,location.origin);
   const id=Number(u.searchParams.get('id'));
   if(Number.isSafeInteger(id)&&id>0){
    if(page==='commessa')selectCommessa(id);
    if(page==='fattura')currentInvoiceId=id;
   }
  }catch(_error){}
  goTo(page);
 }
});
document.getElementById('page').addEventListener('click',async e=>{
 const button=e.target.closest('button[data-action]');
 if(!button||!authToken)return;
 const action=button.dataset.action;
 if(action==='select-commessa'||action==='open-commessa'){
   const row=button.closest('tr');
   const code=row?.cells[0]?.textContent?.trim()||'';
   const title=row?.cells[2]?.textContent?.trim()||'';
   selectCommessa(Number(button.dataset.id),code+' — '+title);
   if(action==='open-commessa')goTo('commessa');
   return;
 }
 button.disabled=true;
 try{
  if(action==='delete'){
   const kind=button.dataset.kind||'',id=Number(button.dataset.id);
   if(!/^[a-z-]{3,30}$/.test(kind)||!Number.isSafeInteger(id)||id<=0)
    throw Error('Identificativo dell’elemento non valido.');
   const label=button.dataset.label||('ID '+id);
   const extra=kind==='documento'?' Verrà eliminato anche il contenuto del file, se presente.':'';
   if(!confirm('Cancellare DEFINITIVAMENTE da Neon TEST l’elemento:\n'+
      label+'\n\nL’operazione non è annullabile.'+extra+
      '\nI record collegati impediscono la cancellazione automatica.'))return;
   // Non ripetere mai automaticamente una DELETE: l'operazione potrebbe essere riuscita.
   const response=await apiCall('/api/v4/records/'+encodeURIComponent(kind)+'/'+id,{
    method:'DELETE',headers:{'X-Confirm-Delete':'true'}
   });
   const result=await response.json();
   if(!result.deleted)throw Error('Il server non ha confermato la cancellazione.');
   alertDemo('Elemento cancellato da Neon TEST · ID '+id+'.');
   if(kind==='commessa'&&id===currentProjectId){
     currentProjectId=0;currentProjectCaption='';goTo('commesse');
   }else show(location.hash.slice(1)||'commesse',false);
  }else if(action==='affida'){
   if(!confirm('Confermi l’affidamento TEST di questa offerta? Il salvataggio sarà reale su Neon.'))return;
   const resp=await apiCall('/api/v4/save/affida',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({offerta_id:button.dataset.id})
   });
   const data=await resp.json();
   alertDemo('Affidamento TEST registrato con ID '+data.id);
   show('commessa',false);
  }else if(action==='download'){
   const response=await apiCall('/api/v4/file/'+encodeURIComponent(button.dataset.id));
   const blob=await response.blob();
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download=button.dataset.filename||'allegato-test';
   document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
 }catch(err){alertDemo('Operazione non completata: '+err.message);}
 finally{button.disabled=false;}
});
document.addEventListener('submit',async e=>{
 const form=e.target.closest('form');
 if(!form||!form.closest('#page'))return;
 e.preventDefault();
 if(!authToken){alertDemo('Accedi prima di salvare');return;}
 const kind=(form.getAttribute('action')||'').replace(/^\//,'');
 const submit=form.querySelector('[type="submit"],button:not([type])');
 if(submit)submit.disabled=true;
 try{
  if(kind==='identificativi'){
   if(!currentProjectId)throw Error('Seleziona una commessa prima di modificare gli identificativi.');
   const data=Object.fromEntries(new FormData(form));
   const response=await apiCall('/api/v4/commesse/'+currentProjectId+'/identificativi',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
   });
   const result=await response.json();
   if(!response.ok||!result.saved||!result.identificativiOnly)
    throw Error(result.error||'Salvataggio identificativi non confermato dal server.');
   currentProjectCaption=data.codice+' — '+data.titolo;
   alertDemo('Identificativi aggiornati in Neon TEST; preventivo e importi invariati.');
   show('commessa',false);return;
  }
  const isUpload=kind==='allega';
  const fields=new FormData(form);
  if(isUpload){
   const file=fields.get('allegato');
   if(!(file instanceof File)||!file.size||file.size>15*1024*1024)
    throw Error('Seleziona un file fino a 15 MB.');
  }
  const options=isUpload?
   {method:'POST',body:fields}:
   {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.fromEntries(fields.entries()))};
  const response=await apiCall(isUpload?'/api/v4/upload':'/api/v4/save/'+encodeURIComponent(kind),options);
  const result=await response.json();
  if(!result.saved)throw Error('Il server non ha confermato il salvataggio');
  alertDemo('Salvataggio REALMENTE eseguito su Neon TEST · ID '+result.id+'.');
  if(kind==='nuova'){
   currentProjectId=Number(result.id);currentProjectCaption='ID '+currentProjectId;goTo('commessa');
  }else if(kind==='fornitore'){show('fornitori',false);}
  else if(kind==='fattura-attiva-nuova'){
   currentInvoiceId=Number(result.id);goTo('fattura');
  }else{show(location.hash.slice(1)||'commesse',false);}
 }catch(err){
  alertDemo('Salvataggio NON riuscito: '+(err.message||'errore')); 
 }finally{if(submit)submit.disabled=false;}
});
document.getElementById('tab-general').onclick=()=>goTo('commesse');
document.getElementById('tab-details').onclick=()=>{if(currentProjectId)goTo('commessa');};
 document.getElementById('tab-quote').onclick=()=>{if(currentProjectId)goTo('preventivo');};
document.getElementById('commesse-version').textContent='V'+UI_VERSION;
syncCommessaTabs('commesse');
document.getElementById('help').onclick=()=>alertDemo('Gestione Commesse V4.3.0 TEST: una commessa nasce soltanto dal preventivo. Dati identificativi modificabili, preventivo consultabile in sola lettura per capitoli. Analisi originali del committente preservate in Dati commessa.');
backButton.addEventListener('click',()=>goTo(parentPage[location.hash.slice(1)]||'commesse'));
window.addEventListener('hashchange',()=>{if(authToken)show(location.hash.slice(1));});
// Avvio chiuso: nessuna vista gestionale prima di login().
})();
</script></body></html>
