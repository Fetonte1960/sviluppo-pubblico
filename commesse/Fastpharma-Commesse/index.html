<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione Commesse V4.10.0 · FastPharma TEST</title>
<style>body{font:15px system-ui,sans-serif;background:#f2f6f8;color:#203648;margin:0}header{background:#163849;color:white;padding:22px max(20px,calc((100% - 1100px)/2))}main{max-width:1100px;margin:26px auto;padding:0 16px}a{color:#116b74}header a{color:#c8e8df;margin-right:20px}section{background:white;padding:22px;border:1px solid #e1e8ed;border-radius:12px;margin:15px 0}h1{margin:0 0 6px}h2{font-size:19px}.muted{color:#687b87}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{padding:14px;background:#edf5f7;border-radius:9px}.metric b{display:block;font-size:20px}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e5edf0;padding:9px;text-align:left}label{display:block;margin:9px 0;font-size:13px;font-weight:600}input,select,textarea{display:block;width:100%;max-width:500px;padding:9px;margin-top:5px;box-sizing:border-box}button{background:#087d78;color:white;border:0;border-radius:7px;padding:10px 14px;cursor:pointer}.warn{padding:12px;background:#fff0d9;border-left:4px solid #d58e14}.bad{color:#aa2834}.good{color:#168057}.test{font-weight:bold;background:#ffe8ad;color:#5b3b00;padding:5px 10px;border-radius:6px}.inline{display:inline}.inline button{font-size:12px;padding:5px 8px}@media(max-width:700px){table{display:block;overflow-x:auto}}
/* Solo cornice della specifica offline, l'interfaccia V4 conserva lo stile originale. */
.demo-ribbon{background:#f8edd6;color:#6b4900;padding:10px 20px;text-align:center;font:600 13px system-ui,sans-serif;border-bottom:1px solid #e6d5ab}
.demo-meta{background:#fff;padding:12px 20px;border-bottom:1px solid #e1e8ed;font:12px system-ui,sans-serif;color:#536d7a}
.demo-meta button{margin-left:10px;padding:5px 10px;font-size:12px}
.demo-toast{position:fixed;bottom:20px;right:20px;background:#163849;color:white;padding:14px;border-radius:9px;max-width:420px;display:none;z-index:9;box-shadow:0 8px 20px #0002}
html{scroll-behavior:smooth}a,button{cursor:pointer}

/* Navigazione comune alle schermate V4: visibile anche durante lo scorrimento. */
.demo-navigation{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:14px;padding:10px max(16px,calc((100% - 1100px)/2));background:#e8f2f4;border-bottom:1px solid #bbd2d9;box-shadow:0 3px 9px #102c3b14}
.demo-navigation[hidden]{display:none}
.demo-navigation button{background:#165a70;font-weight:700}
.demo-navigation span{font-size:13px;color:#345365}
.demo-cloud-status{background:#e9f5f7;color:#23556b;padding:12px;border-left:4px solid #2286a4;border-radius:6px;font-size:13px;line-height:1.5}

/* Campo farmacia: azioni CRM adiacenti e adatte anche a schermi piccoli. */
.crm-client-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0 0}
.crm-client-actions button,.crm-open-contacts{display:inline-flex;align-items:center;justify-content:center;min-height:39px;border-radius:7px;padding:9px 14px;box-sizing:border-box;font:600 13px system-ui,sans-serif}
.crm-open-contacts{background:#e1eff0;color:#126066;border:1px solid #b4d3d1;text-decoration:none}
.crm-open-contacts:hover{background:#cde6e7;text-decoration:underline}
.crm-client-feedback{display:block;margin-top:8px;color:#516776;font-weight:400;line-height:1.4}
input[name="farmacia_id"][readonly]{background:#edf3f4;color:#395466}



.quote-client-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.quote-client-actions a{background:#e1eff0;color:#126066;border:1px solid #b4d3d1;padding:10px 14px;text-decoration:none;border-radius:7px;font-weight:600;font-size:13px}
.quote-client-actions a:hover{text-decoration:underline}
.quote-client-note{font-size:13px;color:#4b6370;margin-bottom:12px}

/* Schermata autenticazione: nessuna vista gestionale prima della verifica sul backend. */
#commesse-app[hidden],#commesse-auth[hidden]{display:none!important}
#commesse-auth{position:fixed;inset:0;background:#eff4f6;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.auth-box{width:min(500px,100%);background:#fff;border:1px solid #cbdde2;border-radius:14px;padding:28px;box-shadow:0 14px 45px #1233}
.auth-box h1{font-size:22px;margin-bottom:14px;color:#163849}
.auth-box input{max-width:none;font-size:17px;border-radius:7px;border:1px solid #8faeb8}
.auth-box button{margin-top:10px;margin-right:8px}
.auth-box .auth-state{font-size:13px;min-height:24px;line-height:1.5;color:#36576b}
.auth-box .auth-error{color:#b31b30}

/* Cancellazione TEST: comando distinto dalle azioni e riconoscibile. */
.delete-record-button{background:#fff0ef;color:#a72b23;border:1px solid #e3aaa7;border-radius:6px;font-weight:700;padding:7px 10px;font-size:12px;cursor:pointer}
.delete-record-button:hover{background:#f9d5d1}
.delete-record-button:disabled{opacity:.5;cursor:not-allowed;background:#e4e8ed;color:#7a8793;border-color:#ced5df}
.delete-collection-panel{margin:14px 0;padding:12px;border:1px solid #d5e2e7;border-radius:8px}
.delete-collection-panel h3{margin-top:0}


/* UI V4.1.0: stessa famiglia visiva di Preventivi, senza modificare le viste V4 ricevute. */
[hidden]{display:none!important}
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef2f6;color:#1e2e40}
body{background:#eef2f6}
button{font-weight:600;background:#1767aa;border-radius:5px}
button:hover{background:#0d4c81}
button:disabled{background:#aab4c0;color:#f6f8fa;cursor:default;opacity:.72}
input,select,textarea{font:inherit;border:1px solid #cad3df;border-radius:5px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #efaf37;outline-offset:2px}
.compact-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;
 background:#17394b;color:white;min-height:58px;flex-wrap:wrap}
.brand-version{font-size:1.12rem;white-space:nowrap}
.brand-version small{font-size:.68rem;padding:3px 6px;border-radius:4px;background:#f6dfab;color:#44320f}
#currentProjectHeader{flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.header-actions{display:flex;gap:8px;white-space:nowrap}
.header-actions button{padding:7px 12px;background:#fff;color:#17394b}
.header-actions button:hover{background:#d9e9f2}
.commesse-workspace{max-width:1850px;margin:auto;padding:0 14px 25px}
.step-tabs{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:14px 0 12px;border-bottom:2px solid #ced9e6}
.step-tab{background:#e1e8f2;color:#324960;border-radius:7px 7px 0 0;padding:12px 16px;font-size:.94rem}
.step-tab.active{background:#fff;color:#164875;border-bottom:3px solid #1773a6;box-shadow:0 -1px 3px #152e4514}
.step-tab:disabled{background:#d9dce2;color:#8a97a4;border-bottom:0;opacity:1}
#page>main{max-width:none;margin:0;padding:0}
#page section{border:1px solid #d7e2ed;border-radius:8px;padding:15px;background:#fff;margin:12px 0}
#page h1{font-size:1.13rem;letter-spacing:0;margin:6px 0 12px}
#page h2{font-size:1rem;color:#184a71}
#page h3{font-size:.94rem}
#page table{width:100%;font-size:.82rem}
#page th{background:#f0f5fa;color:#344c60}
#page td,#page th{padding:9px 10px;border-bottom:1px solid #dae0e9}
#page td a{color:#1767aa;font-weight:600}
#page input,#page select,#page textarea{max-width:none;width:100%}
#page form button{min-height:38px}
#page .general-screen .create-row-section{padding:12px;border:1px solid #d7e2ed}
#page .general-screen .create-row-section h2{margin:0 0 10px}
#page .general-screen .create-row-section form{display:grid;
 grid-template-columns:minmax(105px,.8fr) minmax(180px,1.4fr) minmax(140px,1fr)
 minmax(210px,1.6fr) minmax(125px,.9fr) auto;gap:9px;align-items:end}
#page .general-screen .create-row-section form label{margin:0;min-width:0;font-size:.76rem}
#page .general-screen .create-row-section form input{margin-top:5px;padding:9px 7px;min-width:0}
#page .general-screen .create-row-section form button{white-space:nowrap}
#page .general-screen .crm-client-actions{margin:8px 0}
#page .general-screen .quote-client-actions{margin:7px 0}
#page .general-screen .quote-client-note,#page .general-screen .crm-client-feedback{margin:4px 0;font-size:.8rem}
#page .general-screen .grid-main{min-height:380px}
#page .general-screen .grid-main table{width:100%;table-layout:auto}
#page .general-screen tr[data-project-id]{cursor:pointer}
#page .general-screen tr[data-project-id]:hover{background:#eff7fd}
#page .general-screen tr.selected-project{background:#dceef8;border-left:4px solid #1767aa}
#page .general-screen tr.selected-project td{font-weight:600}
#page .general-screen .grid-main .row-select{background:#e0eaf5;color:#174968}
#page .general-screen .grid-main .row-select[aria-pressed="true"]{background:#1767aa;color:#fff}
#page .general-screen .grid-main .selected-hint{margin:7px 0;color:#617589;font-size:.82rem}
.details-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
 background:white;border:1px solid #d7e2ed;border-radius:8px;padding:10px 12px}
.details-toolbar button{background:#e1e8f2;color:#234d6c}
.details-toolbar button[aria-current="page"]{background:#1767aa;color:white}
.details-toolbar .details-context{margin-left:auto;font-size:.83rem;color:#536b7d}
.client-analysis{background:#f8fbfe!important;border:1px solid #c9dbe9!important}
.client-analysis summary{cursor:pointer;font-size:1rem;color:#184a71;font-weight:700}
.client-analysis .analysis-note{font-size:.84rem;color:#50677b;line-height:1.5;margin:11px 0}
.client-analysis iframe{display:block;width:100%;min-height:750px;max-height:82vh;border:1px solid #c7d5e0;
 border-radius:8px;background:white}
.demo-navigation{position:static;margin:8px 0;background:#e8f2f4;border-radius:8px}
.demo-cloud-status{margin:9px 0}
@media(max-width:1120px){
 #page .general-screen .create-row-section form{grid-template-columns:repeat(3,minmax(150px,1fr))}
}
@media(max-width:720px){
 .compact-header{padding:11px 13px}
 #currentProjectHeader{order:3;flex-basis:100%}
 .step-tab{flex:1;padding:11px 8px;font-size:.86rem}
 #page .general-screen .create-row-section form{grid-template-columns:1fr 1fr}
 #page .general-screen .grid-main{overflow-x:auto}
 .details-toolbar .details-context{margin-left:0}
}
@media(max-width:460px){
 #page .general-screen .create-row-section form{grid-template-columns:1fr}
}





/* V4.10: contabilità generale, sola struttura UI; nessuna connessione contabile. */
.accounting-subtabs{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:12px 0 14px;border-bottom:2px solid #bfd1e0}
.accounting-subtab{padding:10px 15px;border-radius:6px 6px 0 0;background:#e0eaf4;color:#264e6a;font-size:.88rem}
.accounting-subtab[aria-selected="true"]{background:#fff;color:#114b74;border-bottom:3px solid #1773a6}
.accounting-subtab[aria-selected="false"]:hover{background:#cee1f0}
.accounting-pane[hidden]{display:none!important}
.accounting-explanation{color:#4b6172;font-size:.87rem;line-height:1.6}
.accounting-placeholder{padding:22px;border:1px dashed #b8cbd9;border-radius:7px;background:#f8fbfd;color:#536777}
.accounting-placeholder strong{display:block;margin-bottom:5px;color:#234b67}
@media(max-width:720px){.accounting-subtab{flex:1 1 42%;padding:10px 8px;font-size:.8rem}}

/* 4A · Anagrafica fornitori autonoma, indipendente da commessa e Contatti. */
#page .registry-screen>section{margin:12px 0}
.registry-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.registry-toolbar label{flex:1 1 240px;margin:0}
.registry-toolbar input{width:100%;min-height:39px}
.registry-toolbar button{min-height:39px}
.registry-table-scroll{max-width:100%;overflow-x:auto}
.registry-table{min-width:1040px}
.registry-action{background:#e0eaf5;color:#174968;padding:7px 10px;font-size:.8rem}
.registry-edit-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:8px 14px}
.registry-edit-grid label{margin:0;font-size:.8rem}
.registry-edit-grid input,.registry-edit-grid select,.registry-edit-grid textarea{width:100%;max-width:none}
.registry-field-wide{grid-column:span 2}
.registry-field-all{grid-column:1/-1}
.registry-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.registry-buttons .danger{background:#fff0ef;color:#a72b23;border:1px solid #e3aaa7}
.registry-note{color:#486477;font-size:.84rem;line-height:1.5}
.registry-error{color:#ae2837;font-weight:600}
.registry-docs{overflow-x:auto}
.registry-docs table{min-width:950px}
.registry-state-expired{color:#a72b23;font-weight:700}
.registry-state-valid{color:#18754d;font-weight:600}
.registry-state-missing{color:#996828}
@media(max-width:900px){.registry-edit-grid{grid-template-columns:repeat(2,minmax(160px,1fr))}}
@media(max-width:560px){.registry-edit-grid{grid-template-columns:1fr}.registry-field-wide{grid-column:1}}

/* V4.8: incassi dal committente, con analisi distinta dalle fatture passive fornitori. */
.finance-subtabs{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:12px 0 14px;border-bottom:2px solid #bfd1e0}
.finance-subtab{padding:10px 16px;border-radius:6px 6px 0 0;background:#e0eaf4;color:#264e6a;font-size:.88rem}
.finance-subtab[aria-selected="true"]{background:#fff;color:#114b74;border-bottom:3px solid #1773a6}
.finance-subtab[aria-selected="false"]:hover{background:#cee1f0}
.finance-pane[hidden]{display:none!important}
.finance-pane>section{margin:0 0 13px!important}
.finance-readonly-table{overflow-x:auto}
.finance-readonly-table table{min-width:1120px}
.finance-note{font-size:.85rem;line-height:1.6;color:#536777}
@media(max-width:720px){.finance-subtab{flex:1 1 42%;padding:10px 7px;font-size:.8rem}}

/* Fornitori V4.7: tre viste documentali sola lettura e archivio analisi Scaramozzino. */
.supplier-subtabs{display:flex;flex-wrap:wrap;align-items:stretch;gap:7px;margin:12px 0 14px;border-bottom:2px solid #bfd1e0}
.supplier-subtab{padding:10px 15px;border-radius:6px 6px 0 0;background:#e0eaf4;color:#264e6a;font-size:.88rem}
.supplier-subtab[aria-selected="true"]{background:#fff;color:#114b74;border-bottom:3px solid #1773a6}
.supplier-subtab[aria-selected="false"]:hover{background:#cee1f0}
.supplier-pane[hidden]{display:none!important}
.supplier-pane>section{margin:0 0 13px!important}
.supplier-data-grid{overflow-x:auto}
.supplier-data-grid table{min-width:1050px}
.supplier-readonly-note{line-height:1.6;color:#4b6172;font-size:.86rem}
.supplier-crm-pending{color:#956626;font-style:italic}
.supplier-legacy-pane>h2{margin:14px 0}
@media(max-width:720px){.supplier-subtab{flex:1 1 42%;padding:10px 6px;font-size:.8rem}}

/* Gestione Commesse V4.2.0: prima riga coerente con Preventivi. */
#page .general-screen .create-row-section form{display:block}
#page .commesse-create-main-row{
 display:grid;grid-template-columns:minmax(132px,.8fr) minmax(220px,1.9fr)
 auto auto minmax(210px,1.3fr) auto;
 align-items:end;gap:9px;padding:2px 0 8px
}
#page .commesse-create-main-row label{font-size:.76rem;margin:0;min-width:0}
#page .commesse-create-main-row input,#page .commesse-create-main-row select{
 display:block;width:100%;margin-top:5px;min-height:39px;
 overflow:hidden;text-overflow:ellipsis
}
#page .commesse-create-main-row button,#page .commesse-quote-open{
 min-height:39px;white-space:nowrap;display:inline-flex;align-items:center;
 justify-content:center;text-decoration:none;padding:9px 11px;border-radius:5px;
 box-sizing:border-box;font-size:.84rem
}
#page .commesse-create-main-row button.button-secondary,#page .commesse-quote-open{
 background:#e0e9f2;color:#234d6c
}
#page .commesse-quote-field select:disabled{opacity:1;background:#f2f6fa;color:#50677b}
#page .commesse-create-extra{padding:9px 12px;margin-top:7px;border:1px solid #dce5ee;border-radius:7px}
#page .commesse-create-extra summary{font-size:.82rem;font-weight:600;color:#2d566f;cursor:pointer}
#page .commesse-extra-fields{display:grid;grid-template-columns:1.2fr 1fr .75fr;gap:12px;margin:12px 0 3px}
#page .commesse-extra-fields label{margin:0}
#page .general-screen .create-row-section .quote-client-note{font-size:.8rem;margin:4px 0 7px}
@media(max-width:1400px){
 #page .commesse-create-main-row{
  grid-template-columns:minmax(110px,.65fr) minmax(180px,1.5fr)
   auto auto minmax(180px,1.2fr) auto;
 }
}
@media(max-width:1000px){
 #page .commesse-create-main-row{grid-template-columns:repeat(2,minmax(180px,1fr))}
 #page .commesse-create-main-row button[type="submit"]{grid-column:auto}
 #page .commesse-extra-fields{grid-template-columns:1fr 1fr}
}
@media(max-width:530px){
 #page .commesse-create-main-row,#page .commesse-extra-fields{grid-template-columns:1fr}
}

/* Commesse V4.6.0: cinque tab, sezioni V4 conservate e riallocate */
#page .create-row-section{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
#page .create-row-section h2{margin:0;font-size:.99rem}
#page #newCommessaFromQuote{padding:12px 18px;font-size:.94rem}

 minmax(200px,1.4fr);gap:12px}

/* V4.4.0: comandi PDF contestuali (documenti, non preventivi) */

#page .document-actions h2{margin:0;font-size:1rem}

#page .document-actions .document-hint{flex:1 1 340px;font-size:.82rem;margin:0;color:#5e7182}
#page .document-source-panel{width:100%;margin-top:8px;border-top:1px solid #dce5ef;padding-top:12px}
#page .document-source-panel h3{font-size:.94rem;margin:5px 0 8px}
#page .document-source-panel table{width:100%;font-size:.82rem}

#page .document-source-panel .document-draft-note{color:#6a6470;font-size:.82rem}

/* Contratto V4.5.0 — editor dati contrattuali e allegato Preventivi */
#page #contract-status{font-size:.85rem;color:#315d73}
#page #contract-status.error{color:#ab3232;font-weight:650}
#page .contract-archive{display:grid;grid-template-columns:minmax(145px,1fr) minmax(160px,3fr);

<script>
(function(){
'use strict';
const UI_VERSION='4.19.0';
const pages=JSON.parse(document.getElementById('screens').textContent);
// Archivio originale ricevuto: non convertirne le proposte in requisiti approvati.
const originalClientAnalysis=JSON.parse(document.getElementById('client-analysis-original').textContent);
const view=document.getElementById('page'),toast=document.getElementById('toast');
const navigation=document.getElementById('demo-navigation');
const backButton=document.getElementById('demo-back');
const currentLabel=document.getElementById('demo-current');
const parentPage={commesse:null,commessa:'commesse',preventivo:'commesse',fornitori:'commesse',anagrafica:'commesse',fatture:'commesse',fattura:'fatture',contabilita:'commesse'};
const pageLabel={commesse:'Commesse',commessa:'Dati commessa',preventivo:'Preventivo',fornitori:'Fornitori',anagrafica:'Anagrafica fornitori',fatture:'Fatture e pagamenti',fattura:'Dettaglio fattura',contabilita:'Contabilità generale'};
let toastTimeout;
function alertDemo(message){toast.textContent=message;toast.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.style.display='none',4500)}
function routeFor(href){if(href==='/')return 'commesse';if(href.startsWith('/fornitori'))return 'fornitori';if(href.startsWith('/fatture'))return 'fatture';if(href.startsWith('/fattura-attiva'))return 'fattura';if(href.startsWith('/commessa'))return 'commessa';return null}

/* Archivio Neon TEST: accesso in lettura a dati sintetici, senza login e senza scrittura. */
const testApi=location.hostname==='fetonte1960.github.io'
 ? 'https://fastpharma-commesse-api.onrender.com'
 : '';

/* FastPharma Commesse e' client OAuth 2.0/OpenID Connect.
   Authorization Code + PKCE S256, token JWT solo nella RAM di questa pagina;
   non riceve ADMINKEY ne' legge cookie appartenenti a Contatti/Access. */
let authToken='';
const authState=document.getElementById('commesse-auth-status');
const authFeedback=(message,error=false)=>{
 authState.textContent=message;authState.classList.toggle('auth-error',error);
};
const loginButton=document.getElementById('commesse-oidc-login');
const pkceStorageKey='fastpharma.commesse.pkce.v1';
const oidcRedirectUri=location.origin+location.pathname;
let oidcMeta=null;
const pause=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
function transientStatus(code){return [408,425,429,502,503,504].includes(code);}
async function getReadWithWake(url,options={},onProgress=()=>{}){
 // Retry solo su GET/HEAD idempotenti: nessun doppio POST verso Neon o OAuth.
 const method=String(options.method||'GET').toUpperCase();
 if(method!=='GET'&&method!=='HEAD')
  throw Error('Il risveglio automatico è consentito solo per letture idempotenti.');
 const maxAttempts=5;
 for(let attempt=1;attempt<=maxAttempts;attempt++){
  let response;
  try{
   response=await fetch(url,{...options,method,cache:'no-store',
    signal:AbortSignal.timeout(35000)});
  }catch(error){
   if(attempt===maxAttempts)
    throw Error('Server Render non raggiungibile dopo '+maxAttempts+' tentativi.');
   onProgress('Risveglio del server Render: nuovo tentativo '+(attempt+1)+' di '+maxAttempts+'…');
   await pause(Math.min(2000*attempt,8000));continue;
  }
  if(transientStatus(response.status)){
   if(attempt===maxAttempts)
    throw Error('Server Render temporaneamente indisponibile (HTTP '+
      response.status+') dopo '+maxAttempts+' tentativi.');
   onProgress('Server Render in avvio (HTTP '+response.status+
      '), tentativo '+(attempt+1)+' di '+maxAttempts+'…');
   await pause(Math.min(2000*attempt,8000));continue;
  }
  return response; // Non ritentare 400/401/403: sono errori non dovuti al risveglio.
 }
 throw Error('Server Render non disponibile.');
}
async function loadOidcMeta(){
 if(oidcMeta)return oidcMeta;
 const resp=await getReadWithWake(testApi+'/api/meta',{},msg=>authFeedback(msg));
 if(!resp.ok)throw Error('Server Commesse HTTP '+resp.status);
 const info=await resp.json();
 if(info.authentication!=='openid-connect'||
    typeof info.oidcAuthorization!=='string'||
    typeof info.oidcToken!=='string'||
    info.oidcClientId!=='fastpharma-commesse')
   throw Error('Il server Commesse non è configurato come client FastPharma Access.');
 if(!info.oidcAuthorization.startsWith('https://')||
    !info.oidcToken.startsWith('https://'))
   throw Error('Endpoint FastPharma Access non HTTPS.');
 oidcMeta=info;return info;
}
function base64url(bytes){
 const input=Array.from(bytes,x=>String.fromCharCode(x)).join('');
 return btoa(input).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function beginOidcLogin(){
 loginButton.disabled=true;
 authFeedback('Apertura autenticazione centralizzata FastPharma…');
 try{
  const cfg=await loadOidcMeta();
  const verifier=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const state=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const nonce=base64url(crypto.getRandomValues(new Uint8Array(32)));
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
  const challenge=base64url(new Uint8Array(digest));
  const transaction={verifier,state,nonce,redirect:oidcRedirectUri,at:Date.now()};
  sessionStorage.setItem(pkceStorageKey,JSON.stringify(transaction));
  const uri=new URL(cfg.oidcAuthorization);
  uri.searchParams.set('client_id',cfg.oidcClientId);
  uri.searchParams.set('redirect_uri',oidcRedirectUri);
  uri.searchParams.set('response_type','code');
  uri.searchParams.set('response_mode','query');
  uri.searchParams.set('scope','openid profile commesse');
  uri.searchParams.set('state',state);
  uri.searchParams.set('nonce',nonce);
  uri.searchParams.set('code_challenge',challenge);
  uri.searchParams.set('code_challenge_method','S256');
  window.location.assign(uri.toString());
 }catch(error){
  authFeedback('Autenticazione non avviata: '+(error.message||'errore di rete'),true);
  loginButton.disabled=false;
 }
}
async function apiCall(path,options={}){
 if(!authToken)throw Error('Accesso richiesto: usa FastPharma Access');
 const headers=new Headers(options.headers||{});
 headers.set('Authorization','Bearer '+authToken);
 const method=String(options.method||'GET').toUpperCase();
 // Letture protette anche durante il risveglio Render. Le scritture
 // POST/PUT/DELETE vengono effettuate UNA sola volta per evitare duplicati.
 const response=(method==='GET'||method==='HEAD')
  ?await getReadWithWake(testApi+path,{...options,headers},
    msg=>alertDemo(msg))
  :await fetch(testApi+path,{...options,headers,cache:'no-store'});
 if(response.status===401){
  authToken='';
  document.getElementById('commesse-app').hidden=true;
  document.getElementById('commesse-auth').hidden=false;
  const error=Error('La sessione Commesse è scaduta. Accedi di nuovo con FastPharma Access.');
  error.status=401;throw error;
 }
 if(!response.ok){
  const body=await response.json().catch(()=>({}));
  const error=Error(body.error||body.title||
    (transientStatus(response.status)?'Servizio temporaneamente non disponibile':'Server HTTP '+response.status));
  error.status=response.status;error.code=body.code||'';
  throw error;
 }
 return response;
}
async function completeOidcCallback(){
 const parameters=new URLSearchParams(location.search);
 const code=parameters.get('code'),receivedState=parameters.get('state');
 const remoteError=parameters.get('error');
 if(!code && !remoteError)return false;
 // Il codice è eliminato subito dall'URL, anche se il token exchange fallisce.
 history.replaceState(null,'',location.pathname+location.hash);
 if(remoteError)throw Error('FastPharma Access: '+remoteError);
 const saved=sessionStorage.getItem(pkceStorageKey);
 sessionStorage.removeItem(pkceStorageKey);
 let entry;
 try{entry=JSON.parse(saved||'null');}catch(_){entry=null;}
 if(!entry||typeof entry.state!=='string'||entry.state!==receivedState||
    !entry.verifier || entry.redirect!==oidcRedirectUri||
    !Number.isFinite(entry.at)||Date.now()-entry.at>10*60*1000)
   throw Error('Risposta di autorizzazione scaduta o non corrispondente alla richiesta.');
 const cfg=await loadOidcMeta();
 const form=new URLSearchParams({
  grant_type:'authorization_code',client_id:cfg.oidcClientId,
  code,redirect_uri:oidcRedirectUri,code_verifier:entry.verifier
 });
 const res=await fetch(cfg.oidcToken,{
  method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
  cache:'no-store',credentials:'omit',body:form
 });
 const result=await res.json().catch(()=>({}));
 if(!res.ok||typeof result.access_token!=='string')
  throw Error('Token FastPharma Access non ricevuto ('+(result.error||'HTTP '+res.status)+').');
 authToken=result.access_token;
 // Il backend Commesse valida firma, issuer, audience, scadenza e scope;
 // nessun dato operativo viene mostrato prima di questo controllo.
 await apiCall('/api/auth/check');
 document.getElementById('commesse-auth').hidden=true;
 document.getElementById('commesse-app').hidden=false;
 show(['anagrafica','contabilita'].includes(location.hash.slice(1))||pages[location.hash.slice(1)]?location.hash.slice(1):'commesse');
 authFeedback('Sessione FastPharma Access valida. Commesse collegato.');
 return true;
}
loginButton.addEventListener('click',()=>{void beginOidcLogin();});
document.getElementById('commesse-logout').addEventListener('click',()=>{
 authToken='';
 sessionStorage.removeItem(pkceStorageKey);
 document.getElementById('page').replaceChildren();
 document.getElementById('commesse-app').hidden=true;
 document.getElementById('commesse-auth').hidden=false;
 authFeedback('Sessione Commesse terminata. FastPharma Access rimane autenticato.');
 loginButton.disabled=false;
});
(async()=>{
 try{
  if(await completeOidcCallback())return;
  if(new URLSearchParams(location.search).has('error'))return;
  // Apre il login centrale; una sessione Access già valida evita la password.
  await beginOidcLogin();
 }catch(error){
  authToken='';
  authFeedback('Autenticazione non riuscita: '+(error.message||'errore sconosciuto'),true);
  loginButton.disabled=false;
 }
})();

const euro=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});

let currentProjectId=0;
let currentProjectCaption='';
let currentInvoiceId=1;

function syncCommessaTabs(page='commesse'){
 const selected=Number.isSafeInteger(currentProjectId)&&currentProjectId>0;
 const tabs={
  commesse:document.getElementById('tab-general'),
  commessa:document.getElementById('tab-details'),
  preventivo:document.getElementById('tab-quote'),
  fornitori:document.getElementById('tab-suppliers'),
  anagrafica:document.getElementById('tab-supplier-registry'),
  fatture:document.getElementById('tab-invoices'),
  contabilita:document.getElementById('tab-accounting')
 };
 for(const [key,tab] of Object.entries(tabs))if(key!=='commesse'&&key!=='anagrafica'&&key!=='contabilita')tab.disabled=!selected;
 tabs.anagrafica.disabled=false;
 tabs.contabilita.disabled=false;
 const current=page==='fattura'?'fatture':page;
 const active=(tabs[current]&&(selected||current==='anagrafica'||current==='contabilita')?tabs[current]:tabs.commesse).id;
 for(const tab of Object.values(tabs)){
  const on=tab.id===active;tab.classList.toggle('active',on);
  tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1;
 }
 view.setAttribute('aria-labelledby',active);
 const label=selected?(currentProjectCaption||('ID '+currentProjectId)):'nessuna';
 document.getElementById('currentProjectHeader').textContent='Commessa in elaborazione: '+label;
 syncDocumentActions();
}
function selectCommessa(id,caption=''){
 if(!Number.isSafeInteger(id)||id<=0)return;
 if(currentProjectId!==id)currentProjectCaption=caption||('ID '+id);
 else if(caption)currentProjectCaption=caption;
 currentProjectId=id;
 syncCommessaTabs(view.querySelector('main.general-screen')?'commesse':(location.hash.slice(1)||'commessa'));
 for(const tr of view.querySelectorAll('tr[data-project-id]')){
  const active=Number(tr.dataset.projectId)===id;
  tr.classList.toggle('selected-project',active);
  tr.setAttribute('aria-selected',String(active));
  const b=tr.querySelector('[data-action="select-commessa"]');
  if(b){b.textContent=active?'Selezionata':'Seleziona';b.setAttribute('aria-pressed',String(active));}
 }
}

 ["luogo_lavori","Indirizzo dell'immobile / cantiere","text"],

 ["destinazione_uso","Destinazione d'uso","text"],

function syncDocumentActions(){
 const selected=Number.isSafeInteger(currentProjectId)&&currentProjectId>0;
 for(const button of view.querySelectorAll('[data-pdf-document]')){
  button.disabled=!selected;
  button.title=selected
   ?'Prepara e stampa il contratto con il PDF originale del preventivo archiviato'

function contractStatus(message,error=false){

 if(status){status.textContent=message;status.classList.toggle('error',error);}

async function readContractSource(){
 const panel=view.querySelector('#contract-sources');
 if(!panel||!currentProjectId)return;
 const id=currentProjectId;
 const form=panel.querySelector('form');
 contractStatus('Lettura dei dati da Commesse, Contatti e dalla stampa Neon di Preventivi…');
 form.hidden=true;
 try{
  const response=await apiCall('/api/commesse/'+id+'/contratto');
  const body=await response.json().catch(()=>({}));
  if(currentProjectId!==id||!panel.isConnected)return;
  if(!response.ok)throw Error(body.error||body.title||'Dati contratto non disponibili (HTTP '+response.status+').');
  contractState=body;
  const summary=panel.querySelector('#contract-archive');
  summary.replaceChildren();
  const basics=[
   ['Commessa',body.commessa],['Preventivo',body.preventivo],
   ['Stato preventivo',body.stampa?.tipo==='issued'?'EMESSO (non equivale ad accettato)':body.stampa?.tipo||'Da verificare'],
   ['Stato contratto',body.stato==='pronto-per-firma'?'PRONTO PER LA FIRMA (non sottoscritto)':'BOZZA'],
   ['Stampa acquisita',body.stampa?.filename],['UUID stampa',body.stampa?.id],
   ['SHA-256',body.stampa?.sha256],['Committente Contatti',body.committente?.name],
   ['P. IVA committente',body.committente?.vat],
   ['Sede committente',[
     body.committente?.address,body.committente?.postalCode,
     body.committente?.city,body.committente?.province].filter(Boolean).join(' ')],
   ['Appaltatore',body.emittente?.name],['P. IVA appaltatore',body.emittente?.taxId],
   ['Sede appaltatore',body.emittente?.address],
   ['Importo imponibile',euro(body.importo)]
  ];
  for(const [label,value] of basics){
   const term=document.createElement('dt');term.textContent=label;
   const cell=document.createElement('dd');cell.textContent=value||'DA COMPLETARE';
   summary.append(term,cell);
  }
  for(const [name,,type] of contractFields){
   const input=form.querySelector('[name="'+name+'"]');
   if(input)input.value=String(body.configurazione?.[name]||'');
  }
  const missing=Array.isArray(body.mancanti)?body.mancanti:[];
  const warning=panel.querySelector('#contract-missing');
  warning.textContent=missing.length
    ?'Campi obbligatori da completare: '+missing.join(', ')
    :'Dati obbligatori completi. La data di stipula può restare vuota e verrà compilata al momento della firma.';
  const finalBtn=panel.querySelector('#contract-final');

async function saveContractConfig(event){
 event.preventDefault();
 const panel=view.querySelector('#contract-sources');
 const form=event.currentTarget;
 if(!panel||!currentProjectId||!contractState)return;
 const id=currentProjectId,button=panel.querySelector('#contract-save');
 const fields=Object.fromEntries(new FormData(form));
 button.disabled=true;contractStatus('Salvataggio dei parametri della commessa in Neon TEST…');
 try{
  const response=await apiCall('/api/commesse/'+id+'/contratto',{
   method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(fields)
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.saved)throw Error(result.error||result.title||'Salvataggio non confermato.');
  if(id===currentProjectId)await readContractSource();
 }catch(error){
  contractStatus('Salvataggio non confermato: '+error.message,true);
 }finally{if(button.isConnected)button.disabled=false;}
}
async function downloadContractPdf(draft){
 const panel=view.querySelector('#contract-sources');
 if(!panel||!currentProjectId||!contractState)return;
 const id=currentProjectId,button=panel.querySelector(draft?'#contract-draft':'#contract-final');
 button.disabled=true;
 contractStatus('Composizione PDF: contratto più pagine originali dell’allegato preventivo…');
 try{
  const response=await apiCall('/api/commesse/'+id+'/contratto/pdf?bozza='+(draft?'true':'false'));
  if(!response.ok){
   const details=await response.json().catch(()=>({}));
   throw Error(details.error||details.title||'Errore PDF HTTP '+response.status);
  }
  const blob=await response.blob();
  if(blob.type&&!blob.type.includes('pdf'))throw Error('Il server non ha restituito un PDF.');
  const url=URL.createObjectURL(blob);
  const filename='Contratto-'+String(contractState.commessa||id).replace(/[^a-zA-Z0-9-]/g,'')+
    (draft?'-BOZZA':'-PRONTO-FIRMA')+'.pdf';
  const link=document.createElement('a');
  link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  contractStatus('PDF pronto. La stampa originale del preventivo è stata allegata alle pagine del contratto.');
 }catch(error){
  contractStatus('PDF non disponibile: '+error.message,true);
 }finally{if(button.isConnected)button.disabled=false;}
}

async function readProjectBankMovements(code,direction,requestSerial){
 if(!code||code==='Da attribuire')throw Error('Codice commessa non valido');
 const rows=[];
 for(let page=0;;page++){
  const params=new URLSearchParams({commessa:code,direzione:direction,pagina:String(page)});
  const response=await apiCall('/api/v4/contabilita/prima-nota/movimenti?'+params);
  const batch=await response.json();
  if(requestSerial!==renderSerial)return [];
  if(!Array.isArray(batch))throw Error('Risposta movimenti non valida');
  rows.push(...batch);
  if(batch.length<200)return rows;
 }
}
function updateFinanceMetrics(main,active,incassi,passive,pagamenti){
 const sums=(items,key)=>items.reduce((total,x)=>total+number(x[key]),0);
 const confirmed=active.filter(x=>String(x.stato).toLowerCase().startsWith('confermata'));
 const activeTotals={
  activeTaxable:sums(confirmed,'imponibile'),activeVat:sums(confirmed,'iva'),
  received:sums(incassi,'importo'),
  toReceive:confirmed.reduce((acc,x)=>acc+Math.max(0,
   number(x.imponibile)+number(x.iva)-number(x.incassato)),0)
 };
 const passiveTotals={
  passiveTaxable:sums(passive,'imponibile'),
  passiveVat:sums(passive.filter(x=>x.iva!=null),'iva'),
  sent:sums(pagamenti,'importo'),
  toPay:passive.filter(x=>x.iva!=null).reduce((acc,x)=>acc+Math.max(0,
   number(x.imponibile)+number(x.iva)-number(x.pagato)),0)
 };
 for(const [key,value] of Object.entries({...activeTotals,...passiveTotals})){
  const metric=main.querySelector('[data-finance-metric="'+key+'"] b');
  if(metric)metric.textContent=euro(value);
 }
 const warn=main.querySelector('[data-passive-warning]');
 if(warn){
  const missing=passive.filter(x=>x.iva==null).length;
  warn.textContent=missing
   ?'ATTENZIONE: '+missing+' fattura/e passive senza trattamento IVA verificato. I totali lordi passivi sono incompleti.'
   :'Nessuna fattura passiva con IVA da verificare tra i documenti attualmente registrati.';
 }
}

async function accountingLoadRows(refreshCatalog=false){
 const pane=view.querySelector('[data-accounting-pane="movimenti"]');
 if(!pane||pane.hidden||activeMovementSubtab!=='movimenti')return;
 const target=pane.querySelector('.accounting-saved-list');
 if(!target)return;
 const version=++accountingLoadVersion;
 accountingRenderMovements(target,[],'Caricamento dei movimenti…');
 try{
  if(refreshCatalog||accountingCatalog===null||accountingProjects===null){
   const [accountsResponse,projectsResponse]=await Promise.all([
    apiCall('/api/v4/contabilita/prima-nota/conti'),
    apiCall('/api/v4/contabilita/prima-nota/commesse')
   ]);
   const [accounts,projects]=await Promise.all([accountsResponse.json(),projectsResponse.json()]);
   if(version!==accountingLoadVersion||!target.isConnected)return;
   if(!Array.isArray(accounts)||!Array.isArray(projects))throw Error('Filtri contabili non disponibili');
   accountingCatalog=accounts;accountingProjects=projects;
  }
  const assignmentResponse=await apiCall('/api/commesse');
  const assignmentProjects=await assignmentResponse.json();
  if(version!==accountingLoadVersion||!target.isConnected)return;
  if(!Array.isArray(assignmentProjects))throw Error('Elenco commesse non disponibile');
  accountingAssignmentProjects=assignmentProjects.filter(p=>Number.isSafeInteger(Number(p.id))&&Number(p.id)>0);
  if(!accountingAssignmentProjects.some(p=>String(p.id)===accountingAssignmentId))accountingAssignmentId='';
  const rows=[];
  // Paginazione interna, senza pulsanti: la griglia contiene TUTTI i movimenti
  // corrispondenti ai filtri; il backend mantiene blocchi di 200 per richiesta.
  for(let page=0;;page++){
   const params=new URLSearchParams();
   if(accountingBank)params.set('banca',accountingBank);
   if(accountingAccount)params.set('conto',accountingAccount);
   if(accountingProject)params.set('commessa',accountingProject);
   if(accountingDirection)params.set('direzione',accountingDirection);
   params.set('pagina',String(page));
   const response=await apiCall('/api/v4/contabilita/prima-nota/movimenti?'+params.toString());
   const batch=await response.json();
   if(version!==accountingLoadVersion||!target.isConnected)return;
   if(!Array.isArray(batch))throw Error('Risposta movimenti non valida');
   rows.push(...batch);
   accountingRenderMovements(target,rows,batch.length===200?'Altri movimenti in caricamento…':undefined);
   if(batch.length<200)break;
  }
 }catch(error){
  if(version===accountingLoadVersion&&target.isConnected)
   accountingRenderMovements(target,[],'Movimenti non disponibili: '+(error.message||'errore di lettura'));
 }
}

function fmtSnapshotNumber(value,money=false){
 if(value==null||value==='')return '—';
 const n=Number(value);if(!Number.isFinite(n))return '—';
 return money?euro(n):n.toLocaleString('it-IT',{maximumFractionDigits:5});
}
function quoteText(parent,label,value){
 const span=document.createElement('span'),strong=document.createElement('strong');
 strong.textContent=label+': ';span.append(strong,document.createTextNode(value==null||value===''?'—':String(value)));
 parent.append(span);
}

   .map((item,i)=>[i,item.chapter])){

   footer.style.padding='0 14px 10px';
   footer.textContent='Somma delle voci valorizzate: '+fmtSnapshotNumber(subtotal,true)+

   details.append(footer);panel.append(details);
  }
  const note=document.createElement('p');note.className='snapshot-note';
  note.textContent='Le somme delle voci possono differire dal totale imponibile per sconti e rettifiche generali. Il contenuto è di sola consultazione.';

  error.textContent='Impossibile leggere il preventivo archiviato: '+(e.message||'errore');
  panel.append(error);

function renderRows(table,rows,deleteKind='',recordIds=[]){
 if(!table)return;
 const head=table.querySelector('tr');
 table.replaceChildren();
 if(head){
  // Le intestazioni provengono dalla schermata V4, ma le righe dal database.
  if(deleteKind){
   const th=document.createElement('th');th.textContent='Elimina';head.appendChild(th);
  }
  table.appendChild(head);
 }
 if(!rows.length){
  const tr=document.createElement('tr'),td=document.createElement('td');
  td.colSpan=head?.children.length||1;td.textContent='Nessun elemento registrato nel database.';
  tr.appendChild(td);table.appendChild(tr);return;
 }
 for(const [index,row] of rows.entries()){
  const tr=document.createElement('tr');
  for(const cell of row){
   const td=document.createElement('td');
   if(cell&&typeof cell==='object'){
    const action=document.createElement(cell.href?'a':'button');
    action.textContent=valueText(cell.label);
    if(cell.href)action.href=cell.href;
    if(cell.action)action.dataset.action=cell.action;
    if(cell.id!=null)action.dataset.id=String(cell.id);
    if(cell.filename)action.dataset.filename=String(cell.filename);
    td.appendChild(action);
   } else td.textContent=valueText(cell);
   tr.appendChild(td);
  }
  if(deleteKind){
   const td=document.createElement('td');
   const id=Number(recordIds[index]);
   if(Number.isSafeInteger(id)&&id>0){
    const button=document.createElement('button');
    button.type='button';button.className='delete-record-button';
    button.textContent='Elimina';button.dataset.action='delete';
    button.dataset.kind=deleteKind;button.dataset.id=String(id);
    if(deleteKind==='commessa'){
     button.disabled=true;
     button.title='Cancellazione delle commesse disabilitata per sicurezza';
     button.setAttribute('aria-label','Elimina commessa non disponibile');
    }
    button.dataset.label=row.slice(0,2).map(c=>typeof c==='object'?valueText(c.label):valueText(c)).join(' · ').slice(0,170);
    if(deleteKind!=='commessa')button.title='Cancella questo elemento dall’archivio TEST dopo conferma';
    td.appendChild(button);
   }
   tr.appendChild(td);
  }
  table.appendChild(tr);
 }
}

/* Selezione di preventivi: ricevi solo riferimento e snapshot commerciale;
   i preventivi DEMO sono su backend separato e non su Neon. */
const preventiviUrl='https://fetonte1960.github.io/sviluppo-pubblico/commesse/Preventivi/';
let preventiviPicker=null,preventiviNonce='',preventiviReady=false;

let commessaCreationPending=false;
function openQuotePicker(){
 if(commessaCreationPending){
  alertDemo('Creazione della commessa già in corso. Attendi la risposta del server TEST.');
  return;
 }
 preventiviNonce=newPickerNonce();preventiviReady=false;
 const url=new URL('selettore.html',preventiviUrl);
 url.searchParams.set('client','commesse');url.searchParams.set('nonce',preventiviNonce);
 preventiviPicker=window.open(url.href,'fastpharma-preventivi-selettore',
  'width=1180,height=820,resizable=yes,scrollbars=yes');
 if(!preventiviPicker){
  preventiviNonce='';alertDemo('Popup bloccato: abilita finestre emergenti per il selettore.');
 }else{
  preventiviPicker.focus();
  alertDemo('Scegli un preventivo: la conferma nel selettore creerà la commessa TEST.');
 }
}
window.addEventListener('message',async event=>{
 if(event.origin!==new URL(preventiviUrl).origin ||
    event.source!==preventiviPicker||!preventiviNonce)return;
 const d=event.data;
 if(d?.type==='fastpharma.quote-picker.ready'&&d.nonce===preventiviNonce){
  preventiviPicker.postMessage({type:'fastpharma.quote-picker.ack',nonce:preventiviNonce},event.origin);
  preventiviReady=true;return;
 }
 if(!preventiviReady||d?.type!=='fastpharma-commesse.quote-selected'||
    d.nonce!==preventiviNonce||commessaCreationPending)return;
 if(typeof d.id!=='string'||!/^[0-9a-f-]{36}$/i.test(d.id)||
    typeof d.reference!=='string'||d.reference.length>160||
    typeof d.subject!=='string'||!d.subject.trim()||d.subject.length>240||
    typeof d.recipientName!=='string'||!d.recipientName.trim()||
    d.recipientName.length>250||typeof d.taxable!=='number'||
    !Number.isFinite(d.taxable)||d.taxable<0||d.taxable>999999999999||
    !d.snapshot||d.snapshot.version!=='commesse-quote-v1'||
    d.snapshot.id!==d.id||d.snapshot.reference!==d.reference||
    !Array.isArray(d.snapshot.chapters)){
  alertDemo('Selezione del preventivo incompleta: nessuna commessa creata.');
  return;
 }
 const snapshotText=JSON.stringify(d.snapshot);
 if(snapshotText.length>1024*1024){
  alertDemo('Il corpo del preventivo supera 1 MB: nessuna commessa creata.');
  return;
 }
 // Blocca ogni ripetizione dell'evento prima di inviare la richiesta POST.
 commessaCreationPending=true;preventiviNonce='';preventiviReady=false;
 const createButton=view.querySelector('#newCommessaFromQuote');
 if(createButton)createButton.disabled=true;
 try{
  const response=await apiCall('/api/v4/save/nuova',{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    preventivo_id:d.id,preventivo_riferimento:d.reference,
    preventivo_snapshot:snapshotText
   })
  });
  const result=await response.json();
  if(!response.ok||!result.saved||!Number.isSafeInteger(Number(result.id)))
   throw Error(result.error||'Creazione della commessa non confermata dal backend.');
  currentProjectId=Number(result.id);
  currentProjectCaption=String(result.codice||('ID '+currentProjectId))+' — '+d.subject;
  alertDemo('Commessa creata in Neon TEST dal preventivo '+d.reference+'.');
  goTo('commessa');
 }catch(error){
  alertDemo('Creazione NON confermata: '+(error.message||'errore')+
   '. Controlla l’archivio prima di ripetere, per evitare duplicazioni.');
 }finally{
  commessaCreationPending=false;preventiviPicker=null;
  if(createButton?.isConnected)createButton.disabled=false;
 }
});

   const u=new URL(target,location.origin);
   const id=Number(u.searchParams.get('id'));
   if(Number.isSafeInteger(id)&&id>0){
    if(page==='commessa')selectCommessa(id);
    if(page==='fattura')currentInvoiceId=id;
   }
  }catch(_error){}
  goTo(page);
 }
});
document.getElementById('page').addEventListener('click',async e=>{
 const button=e.target.closest('button[data-action]');
 if(!button||!authToken)return;
 const action=button.dataset.action;
 if(action==='select-commessa'||action==='open-commessa'){
   const row=button.closest('tr');
   const code=row?.cells[0]?.textContent?.trim()||'';
   const title=row?.cells[2]?.textContent?.trim()||'';
   selectCommessa(Number(button.dataset.id),code+' — '+title);
   if(action==='open-commessa')goTo('commessa');
   return;
 }
 button.disabled=true;
 try{
  if(action==='delete'){
   const kind=button.dataset.kind||'',id=Number(button.dataset.id);
   // Difesa supplementare: la UI non puo' inviare DELETE per una commessa.
   if(kind==='commessa'){
    alertDemo('Cancellazione commesse disabilitata per evitare eliminazioni accidentali.');return;
   }
   if(!/^[a-z-]{3,30}$/.test(kind)||!Number.isSafeInteger(id)||id<=0)
    throw Error('Identificativo dell’elemento non valido.');
   const label=button.dataset.label||('ID '+id);
   const extra=kind==='documento'?' Verrà eliminato anche il contenuto del file, se presente.':'';
   if(!confirm('Cancellare DEFINITIVAMENTE da Neon TEST l’elemento:\n'+
      label+'\n\nL’operazione non è annullabile.'+extra+
      '\nI record collegati impediscono la cancellazione automatica.'))return;
   // Non ripetere mai automaticamente una DELETE: l'operazione potrebbe essere riuscita.
   const response=await apiCall('/api/v4/records/'+encodeURIComponent(kind)+'/'+id,{
    method:'DELETE',headers:{'X-Confirm-Delete':'true'}
   });
   const result=await response.json();
   if(!result.deleted)throw Error('Il server non ha confermato la cancellazione.');
   alertDemo('Elemento cancellato da Neon TEST · ID '+id+'.');
   if(kind==='commessa'&&id===currentProjectId){
     currentProjectId=0;currentProjectCaption='';goTo('commesse');
   }else show(location.hash.slice(1)||'commesse',false);
  }else if(action==='affida'){
   if(!confirm('Confermi l’affidamento TEST di questa offerta? Il salvataggio sarà reale su Neon.'))return;
   const resp=await apiCall('/api/v4/save/affida',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({offerta_id:button.dataset.id})
   });
   const data=await resp.json();
   alertDemo('Affidamento TEST registrato con ID '+data.id);
   show('fornitori',false);
  }else if(action==='download'){
   const response=await apiCall('/api/v4/file/'+encodeURIComponent(button.dataset.id));
   const blob=await response.blob();
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');a.href=url;a.download=button.dataset.filename||'allegato-test';
   document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  }
 }catch(err){alertDemo('Operazione non completata: '+err.message);}
 finally{button.disabled=false;}
});
document.addEventListener('submit',async e=>{
 const form=e.target.closest('form');
 if(!form||!form.closest('#page'))return;
 e.preventDefault();
 if(!authToken){alertDemo('Accedi prima di salvare');return;}
 const kind=(form.getAttribute('action')||'').replace(/^\//,'');
 const submit=form.querySelector('[type="submit"],button:not([type])');
 if(submit)submit.disabled=true;
 try{
  if(kind==='identificativi'){
   if(!currentProjectId)throw Error('Seleziona una commessa prima di modificare gli identificativi.');
   const data=Object.fromEntries(new FormData(form));
   const response=await apiCall('/api/v4/commesse/'+currentProjectId+'/identificativi',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)
   });
   const result=await response.json();
   if(!response.ok||!result.saved||!result.identificativiOnly)
    throw Error(result.error||'Salvataggio identificativi non confermato dal server.');
   currentProjectCaption=data.codice+' — '+data.titolo;
   alertDemo('Identificativi aggiornati in Neon TEST; preventivo e importi invariati.');
   show('commessa',false);return;
  }
  const isUpload=kind==='allega';
  const fields=new FormData(form);
  if(isUpload){
   const file=fields.get('allegato');
   if(!(file instanceof File)||!file.size||file.size>15*1024*1024)
    throw Error('Seleziona un file fino a 15 MB.');
  }
  const options=isUpload?
   {method:'POST',body:fields}:
   {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.fromEntries(fields.entries()))};
  const response=await apiCall(isUpload?'/api/v4/upload':'/api/v4/save/'+encodeURIComponent(kind),options);
  const result=await response.json();
  if(!result.saved)throw Error('Il server non ha confermato il salvataggio');
  alertDemo('Salvataggio REALMENTE eseguito su Neon TEST · ID '+result.id+'.');
  if(kind==='nuova'){
   currentProjectId=Number(result.id);currentProjectCaption='ID '+currentProjectId;goTo('commessa');
  }else if(kind==='fornitore'){show('fornitori',false);}
  else if(kind==='fattura-attiva-nuova'){
   currentInvoiceId=Number(result.id);goTo('fattura');
  }else{show(location.hash.slice(1)||'commesse',false);}
 }catch(err){
  alertDemo('Salvataggio NON riuscito: '+(err.message||'errore')); 
 }finally{if(submit)submit.disabled=false;}
});
